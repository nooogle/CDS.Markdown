name: Release

on:
  push:
    tags:
      - 'V*.*.*' # Triggers on version tags like V1.2.3

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    environment: nuget

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack CDS.Markdown.Lite/CDS.Markdown.Lite.csproj --configuration Release --no-build --output ./nupkg
          dotnet pack CDS.Markdown/CDS.Markdown.csproj --configuration Release --no-build --output ./nupkg

      - name: Generate SBOM
        shell: pwsh
        run: |
          dotnet tool install --global CycloneDX

          # IncludeSymbols=true with no SymbolPackageFormat produces a legacy *.symbols.nupkg
          # alongside each real package. Two packages now share the ./nupkg output directory, so
          # match each package's exact id followed by the start of its version (a digit) - a bare
          # "CDS.Markdown.*.nupkg" wildcard would also match CDS.Markdown.Lite's package.
          function Get-PackageVersion([string]$id) {
            $pattern = "^$([regex]::Escape($id))\.\d"
            $pkg = Get-ChildItem -Path ./nupkg -Filter '*.nupkg' |
              Where-Object { $_.Name -notlike '*.symbols.nupkg' -and $_.BaseName -match $pattern }
            return $pkg.BaseName.Substring($id.Length + 1)
          }

          $liteVersion = Get-PackageVersion 'CDS.Markdown.Lite'
          dotnet-CycloneDX CDS.Markdown.Lite/CDS.Markdown.Lite.csproj -o ./nupkg/sbom-lite -F json -sv $liteVersion

          $mainVersion = Get-PackageVersion 'CDS.Markdown'
          dotnet-CycloneDX CDS.Markdown/CDS.Markdown.csproj -o ./nupkg/sbom-main -F json -sv $mainVersion

          # Both tools write "bom.json" in their own subfolder (needed so the two Attest SBOM
          # steps below each get an unambiguous path). GitHub Release assets are flat with no
          # folder structure though, so uploading both files as-is would collide on the same
          # "bom.json" name and silently keep only one - copy each to a package-qualified name at
          # the top level for the Create GitHub Release step to reference instead.
          Copy-Item ./nupkg/sbom-lite/bom.json ./nupkg/CDS.Markdown.Lite.bom.json
          Copy-Item ./nupkg/sbom-main/bom.json ./nupkg/CDS.Markdown.bom.json

      # actions/attest-build-provenance and actions/attest-sbom are both now thin wrappers over
      # actions/attest (which auto-detects provenance vs. SBOM mode from whether sbom-path is
      # set) - attest-sbom specifically logs a runtime deprecation warning, so all three steps
      # below use the unified action directly instead.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ./nupkg/*.nupkg
            !./nupkg/*.symbols.nupkg

      - name: Attest SBOM (CDS.Markdown.Lite)
        uses: actions/attest@v4
        with:
          subject-path: ./nupkg/CDS.Markdown.Lite.*.nupkg
          sbom-path: ./nupkg/sbom-lite/bom.json

      - name: Attest SBOM (CDS.Markdown)
        uses: actions/attest@v4
        with:
          # Matches CDS.Markdown's own package only - a digit follows the id, unlike
          # CDS.Markdown.Lite's package name.
          subject-path: ./nupkg/CDS.Markdown.[0-9]*.nupkg
          sbom-path: ./nupkg/sbom-main/bom.json

      - name: Authenticate with NuGet (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-auth
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        shell: pwsh
        run: |
          # Excludes *.symbols.nupkg (legacy symbol package format) — pushing it
          # through the same path as the real package is not what nuget.org's
          # main index expects; this bug was already live before this change.
          Get-ChildItem -Path ./nupkg -Filter *.nupkg | Where-Object { $_.Name -notlike "*.symbols.nupkg" } | ForEach-Object {
            dotnet nuget push $_.FullName --api-key ${{ steps.nuget-auth.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./nupkg/*.nupkg
            ./nupkg/CDS.Markdown.Lite.bom.json
            ./nupkg/CDS.Markdown.bom.json
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

