name: CodeQL Security Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * 1'   # weekly, Monday

jobs:
  analyze:
    name: Analyze Code Security
    runs-on: windows-latest   # match ci.yml's OS choice
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build --configuration Release

      - uses: github/codeql-action/analyze@v4
