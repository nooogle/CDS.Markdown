name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  # PR labels are issue labels, so the label step needs the issues scope too.
  issues: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Inter-repo CDS.* bumps are left to release_sweep.ps1, which merges them
      # in dependency order -- auto-merging one early can break a downstream
      # repo's restore, which is exactly what the sweep's build order prevents.
      - name: Flag majors and internal bumps for review
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-major' ||
          contains(steps.metadata.outputs.dependency-names, 'CDS.')
        # gh api rather than 'gh pr edit --add-label': gh pr edit also queries
        # projectCards, which 403s unless repository-projects: read is granted as
        # well (cli/cli#6274). This touches the labels endpoint and nothing else.
        run: gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=needs-review"
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for third-party minor and patch
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch') &&
          !contains(steps.metadata.outputs.dependency-names, 'CDS.')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
