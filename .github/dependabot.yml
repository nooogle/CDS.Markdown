version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: [ "dependencies", "nuget" ]
    reviewers: [ "nooogle" ]
    assignees: [ "nooogle" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels: [ "dependencies", "github_actions" ]
    reviewers: [ "nooogle" ]
    assignees: [ "nooogle" ]
